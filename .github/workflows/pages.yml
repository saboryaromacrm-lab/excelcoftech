# Publica Coftech Excel en GitHub Pages cada vez que se sube un cambio.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/blissful-hypatia-tcbiyo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp dist/coftech-excel.html _site/index.html
          cp dist/coftech-excel.html _site/coftech-excel.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
